  <path d="M92,368 C152,368 190,310 218,238 C244,172 272,126 316,112" fill="none" stroke="url(#g)" stroke-width="56" stroke-linecap="round"/>
  <circle cx="378" cy="78" r="48" fill="url(#g)"/>
