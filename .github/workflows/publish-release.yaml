name: release

# Called by ci.yaml once per channel. Publishes whatever the build matrix
# produced, so one failing platform does not block the release.

on:
  workflow_call:
    inputs:
      channel:
        description: Release channel
        required: true
        type: string
      branch:
        description: Mirrored upstream branch the build came from
        required: true
        type: string
      latest:
        description: Mark this release as the repository's latest
        required: true
        type: boolean

env:
  UPSTREAM_REPO: chen08209/FlClash

jobs:
  release:
    name: ${{ inputs.channel }}
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout mirrored source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifact-${{ inputs.channel }}-*
          merge-multiple: true
          path: dist

      - name: Prepare metadata
        id: meta
        env:
          CHANNEL: ${{ inputs.channel }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no artifacts were produced for $CHANNEL; nothing to release"
            exit 1
          fi

          version="$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r' | cut -d+ -f1)"
          commit="$(git rev-parse --short HEAD)"
          stamp="$(date -u +%y%m%d%H)"
          tag="${CHANNEL}-${version}-${stamp}.${{ github.run_number }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          (cd dist && sha256sum ./* > SHA256SUMS)

          {
            echo "Self-signed build of \`${BRANCH}\` from [${UPSTREAM_REPO}](https://github.com/${UPSTREAM_REPO}/commit/${commit})."
            echo
            echo "- channel: \`${CHANNEL}\`"
            echo "- version: \`${version}\`"
            echo "- upstream commit: \`${commit}\`"
            echo "- built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Signed with this repository's own keystore. Because the certificate differs from the official build, uninstall the previously installed FlClash once before installing this APK."
            echo
            echo "| file | download |"
            echo "| --- | --- |"
            for f in dist/*; do
              name="$(basename "$f")"
              [ "$name" = SHA256SUMS ] && continue
              echo "| \`${name}\` | [download](https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${name}) |"
            done
          } > release-notes.md

          echo "tag=$tag version=$version commit=$commit"
          ls -la dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$BRANCH" \
            --title "FlClash ${{ steps.meta.outputs.version }} (${{ inputs.channel }}) ${{ steps.meta.outputs.tag }}" \
            --notes-file release-notes.md \
            ${{ inputs.latest && '--latest' || '--latest=false' }}

      # Same shape as the other release bots in this account
      # (aqiyoung/datbox-android, aqiyoung/iptv-app-check): a plain sendMessage
      # carrying download links. The installers are far over the 50 MB cap the
      # cloud Bot API puts on uploads, and a link uploads nothing at all, so no
      # self-hosted Bot API server is needed.
      - name: Announce on Telegram
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail

          # gh-proxy.com in front of github.com: the assets live on GitHub,
          # which is unreachable for a large part of the audience.
          prefix="https://gh-proxy.com/https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/"

          {
            echo "📦 FlClash ${VERSION}（${CHANNEL}）构建成功"
            echo
            for name in \
              "FlClash-${VERSION}-android-arm64-v8a.apk" \
              "FlClash-${VERSION}-android-armeabi-v7a.apk" \
              "FlClash-${VERSION}-windows-amd64-setup.exe" \
              "FlClash-${VERSION}-macos-arm64.dmg" \
              "FlClash-${VERSION}-macos-amd64.dmg" \
              "FlClash-${VERSION}-linux-amd64.AppImage"; do
              [ -f "dist/$name" ] || continue
              echo "• ${name}"
              echo "  ${prefix}${name}"
            done
            echo
            echo "全部文件：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo "构建日志：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/msg.txt

          cat /tmp/msg.txt

          # -f: a rejected post (bad token, chat the bot cannot write to) fails
          # visibly instead of reporting success.
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@/tmp/msg.txt" \
            || echo "::error::Telegram 推送失败 — 检查 TELEGRAM_BOT_TOKEN 是否有效、TELEGRAM_CHAT_ID 是否是 bot 能发消息的会话或群"
