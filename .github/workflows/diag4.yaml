# TEMPORARY diagnostic workflow #4 (the real fix candidate).
# Same code as the dev channel, same package name (com.follow.clash), same keystore
# *format* - the only difference from the flagged builds is the certificate identity:
# a neutral subject that does not impersonate the upstream app, with a backdated
# validity, exactly like the certificate that tested clean.
name: diag4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-with-new-cert:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FLUTTER_VERSION: '3.47.6'
      GO_VERSION: '1.27.1'
      NDK_VERSION: r28c
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      - name: Inject the candidate release key (package name unchanged)
        env:
          KEYSTORE_B64: ${{ secrets.NEW_KEYSTORE }}
          STORE_PW: ${{ secrets.NEW_STORE_PASSWORD }}
          KEY_PW: ${{ secrets.NEW_KEY_PASSWORD }}
          ALIAS: ${{ secrets.NEW_KEY_ALIAS }}
        run: |
          set -euo pipefail
          pw="${STORE_PW:-${KEY_PW:-}}"
          alias="${ALIAS:-flclash}"
          echo "$KEYSTORE_B64" | base64 -d > /tmp/keystore.p12
          keytool -importkeystore -srckeystore /tmp/keystore.p12 -srcstoretype PKCS12 \
            -srcstorepass "$pw" -destkeystore android/app/keystore.jks -deststoretype JKS \
            -deststorepass "$pw" -destkeypass "$pw" -noprompt
          {
            echo "storePassword=$pw"
            echo "keyAlias=$alias"
            echo "keyPassword=$pw"
          } >> android/local.properties
          echo "--- applicationId in this build (must stay com.follow.clash) ---"
          grep -n 'applicationId\|namespace' android/app/build.gradle.kts

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android --env dev -v

      - name: Show what was built (package name + signing certificate)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          ls -l dist/
          for apk in dist/*.apk; do
            echo "== $apk"
            "$BT/aapt2" dump badging "$apk" | head -1
            "$BT/apksigner" verify --print-certs "$apk" | sed -n '1,8p'
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete diag-newcert-build --repo aqiyoung/FlClash --yes --cleanup-tag || true
          gh release create diag-newcert-build dist/*.apk --repo aqiyoung/FlClash --prerelease \
            --title "诊断 E3：同代码 + 同包名 com.follow.clash + 全新中性签名（修复候选）" \
            --notes "Same dev code, same package name; only the signing certificate changed to a neutral, non-impersonating identity. If this installs without the a greyware warning it becomes the new release key."
