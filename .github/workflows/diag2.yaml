# TEMPORARY diagnostic workflow #2: pinpoint the 2 stray DEX bytes and check libclash.so.
name: diag2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OURS_TAG: stable-0.9.0-26101615.4
      UP_TAG: v0.9.0
    steps:
      - name: Download both arm64 APKs
        run: |
          set -euo pipefail
          curl -fsSL -o ours.apk "https://github.com/aqiyoung/FlClash/releases/download/${OURS_TAG}/FlClash-0.9.0-android-arm64-v8a.apk"
          curl -fsSL -o upstream.apk "https://github.com/chen08209/FlClash/releases/download/${UP_TAG}/FlClash-0.9.0-android-arm64-v8a.apk"

      - name: Extract payload entries and report their real format
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, zipfile
          names = ['classes.dex', 'lib/arm64-v8a/libclash.so', 'lib/arm64-v8a/libapp.so']
          for side in ('ours', 'upstream'):
              with zipfile.ZipFile(f'{side}.apk') as zf:
                  for n in names:
                      i = zf.getinfo(n)
                      data = zf.read(i)
                      out = os.path.join(f'x_{side}', n)
                      os.makedirs(os.path.dirname(out), exist_ok=True)
                      open(out, 'wb').write(data)
                      print('%-8s %-32s method=%-3d comp=%-10d plain=%-10d head=%s'
                            % (side, n, i.compress_type, i.compress_size, len(data), data[:4].hex()))
          PY
          for side in ours upstream; do
            echo "--- $side"
            ls -l "x_$side/lib/arm64-v8a/libclash.so"
            file "x_$side/lib/arm64-v8a/libclash.so" || true
            xxd -l 24 "x_$side/lib/arm64-v8a/libclash.so" || true
          done

      - name: Pinpoint the two stray bytes inside the DEX
        run: |
          python3 - <<'PY'
          import struct

          def u32(b, o): return struct.unpack_from('<I', b, o)[0]

          def uleb(b, o):
              r = 0; s = 0
              while True:
                  x = b[o]; o += 1; r |= (x & 0x7f) << s
                  if not (x & 0x80): return r, o
                  s += 7

          def tables(b):
              strings = []
              n, off = u32(b, 56), u32(b, 60)
              for i in range(n):
                  so = u32(b, off + i * 4)
                  sz, p = uleb(b, so)
                  strings.append(b[p:p + sz].decode('utf-8', 'replace'))
              types = []
              n, off = u32(b, 64), u32(b, 68)
              for i in range(n):
                  types.append(strings[u32(b, off + i * 4)])
              methods = []
              n, off = u32(b, 88), u32(b, 92)
              for i in range(n):
                  cls, _proto = struct.unpack_from('<HH', b, off + i * 8)
                  methods.append('%s.%s' % (types[cls], strings[u32(b, off + i * 8 + 4)]))
              return strings, types, methods

          def code_items(b):
              _s, _t, methods = tables(b)
              out = []
              n, off = u32(b, 96), u32(b, 100)
              for i in range(n):
                  cdo = u32(b, off + i * 32 + 24)
                  if not cdo: continue
                  p = cdo
                  sf, p = uleb(b, p); inf, p = uleb(b, p)
                  dm, p = uleb(b, p); vm, p = uleb(b, p)
                  for _ in range(sf + inf):
                      _, p = uleb(b, p); _, p = uleb(b, p)
                  cum = 0
                  for _ in range(dm + vm):
                      d, p = uleb(b, p); _, p = uleb(b, p); co, p = uleb(b, p)
                      cum += d
                      if co:
                          out.append((co, methods[cum]))
              return out

          a = open('x_ours/classes.dex', 'rb').read()
          b = open('x_upstream/classes.dex', 'rb').read()
          offs = [i for i in range(min(len(a), len(b))) if a[i] != b[i]]
          body = [o for o in offs if o >= 32]
          print('total differing bytes:', len(offs), '| outside the 32-byte header:', len(body))
          items = sorted(code_items(a))
          print('code_items found:', len(items))

          for o in body:
              hit = None
              for co, name in items:
                  if co <= o < co + 16:
                      hit = ('code_item header field', co, name); break
                  insns = co + 16
                  size = u32(a, co + 12)
                  end = insns + size * 2
                  if insns <= o < end:
                      hit = ('INSTRUCTION (insns) unit %d/opcode 0x%02x' % ((o - insns) // 2, a[insns + ((o - insns) // 2) * 2] & 0xff), co, name); break
                  if end <= o < end + 8:
                      hit = ('padding right after insns', co, name); break
              print()
              if hit:
                  print('offset %d -> %s' % (o, hit[0]))
                  print('    method: %s' % hit[2])
                  print('    ours    :', a[max(0, o - 8):o + 8].hex(' '), '| byte=0x%02x' % a[o])
                  print('    upstream:', b[max(0, o - 8):o + 8].hex(' '), '| byte=0x%02x' % b[o])
              else:
                  print('offset %d -> not inside any code_item header/insns (between items or trailing padding)' % o)
                  print('    ours    :', a[max(0, o - 8):o + 8].hex(' '), '| byte=0x%02x' % a[o])
                  print('    upstream:', b[max(0, o - 8):o + 8].hex(' '), '| byte=0x%02x' % b[o])
          print()
          print('sha256 of everything after the 32-byte header:')
          import hashlib
          print('   ours    :', hashlib.sha256(a[32:]).hexdigest())
          print('   upstream:', hashlib.sha256(b[32:]).hexdigest())
          PY

      - name: Disassemble both DEX and diff the smali-level text
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          echo "build-tools contents: $(ls "$BT" | tr '\n' ' ')"
          if [ ! -x "$BT/dexdump" ]; then echo "dexdump not available, skipping"; exit 0; fi
          "$BT/dexdump" -d x_ours/classes.dex > ours.dump.txt 2>/dev/null
          "$BT/dexdump" -d x_upstream/classes.dex > upstream.dump.txt 2>/dev/null
          wc -l ours.dump.txt upstream.dump.txt
          diff ours.dump.txt upstream.dump.txt > dex.diff || true
          echo "disassembly diff line count: $(wc -l < dex.diff)"
          head -60 dex.diff

      - name: libclash.so comparison
        run: |
          set -euo pipefail
          for side in ours upstream; do
            so="x_$side/lib/arm64-v8a/libclash.so"
            size -A "$so" | awk '$1 ~ /^\./ {print $1, $2}' | sort > "$side.sections.txt"
            readelf -sW "$so" 2>/dev/null | awk 'NF>=8 && $4=="FUNC" {print $8}' | sort > "$side.syms.txt"
            objcopy -O binary --only-section=.text "$so" "/tmp/$side.text.bin" 2>/dev/null || echo "  ($side: objcopy .text failed)"
            objcopy -O binary --only-section=.gopclntab "$so" "/tmp/$side.pcln.bin" 2>/dev/null || echo "  ($side: objcopy .gopclntab failed)"
          done
          echo "=== section sizes: ours vs upstream ==="
          diff ours.sections.txt upstream.sections.txt && echo "  (identical)"
          echo "=== exported FUNC symbol count ==="
          echo "  ours=$(wc -l < ours.syms.txt) upstream=$(wc -l < upstream.syms.txt)"
          diff ours.syms.txt upstream.syms.txt > /tmp/sym.diff || true
          echo "  symbol-list diff lines: $(wc -l < /tmp/sym.diff)"
          head -6 /tmp/sym.diff
          echo "=== raw section hashes ==="
          sha256sum /tmp/ours.text.bin /tmp/upstream.text.bin /tmp/ours.pcln.bin /tmp/upstream.pcln.bin 2>/dev/null || true
          echo "=== libapp.so (Dart AOT) ==="
          sha256sum x_ours/lib/arm64-v8a/libapp.so x_upstream/lib/arm64-v8a/libapp.so
