name: sync upstream and release

# `ci` is this repository's default branch and holds *only* the automation.
# `stable` and `beta` are ours: upstream's branch plus our own commits rebased on
# top. Rebasing is what keeps our patches alive across every upstream sync, and
# upstream rewrites `dev` (force-pushes) often enough that a merge is not an
# option. A sync that cannot be applied cleanly stops loudly and tells Telegram
# instead of quietly shipping upstream alone.
#
# Flow: rebase stable<-main and beta<-dev -> build the channels that moved ->
# sign with our own keystore -> tag + GitHub Release -> announce on Telegram.

on:
  # Hourly. The sync job compares branch tips first, so a run with nothing new
  # to bring in stops there and publishes nothing -- "upstream moved" is the
  # trigger, not the clock.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Which channel to sync and build
        type: choice
        options:
          - all
          - stable
          - beta
        default: all
      force_build:
        description: Build even when upstream has not moved
        type: boolean
        default: false
      publish:
        description: Create the release and announce it on Telegram
        type: boolean
        default: true

concurrency:
  group: sync-and-release
  cancel-in-progress: false

# The sync force-pushes our branches and the release creates tags, so the token
# needs write access to contents.
permissions:
  contents: write

env:
  UPSTREAM_REPO: chen08209/FlClash

jobs:
  sync:
    name: Sync upstream
    runs-on: ubuntu-latest
    outputs:
      build_stable: ${{ steps.plan.outputs.build_stable }}
      build_beta: ${{ steps.plan.outputs.build_beta }}
      version_stable: ${{ steps.rebase.outputs.version_stable }}
      version_beta: ${{ steps.rebase.outputs.version_beta }}
    steps:
      - name: Rebase our branches onto upstream
        id: rebase
        env:
          # GITHUB_TOKEN is refused when a push touches .github/workflows, which
          # an upstream sync regularly does, so the push needs a PAT carrying the
          # `workflow` scope.
          TOKEN: ${{ secrets.MIRROR_TOKEN || github.token }}
          CHANNEL: ${{ inputs.channel || 'all' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          auth="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --quiet --filter=blob:none "$auth" work
          cd work
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          # Only the two branches we track: a bare fetch pulls every feature
          # branch upstream happens to have open.
          git fetch --quiet --filter=blob:none upstream main dev
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          case "$CHANNEL" in
            all) channels="stable beta" ;;
            stable) channels="stable" ;;
            beta) channels="beta" ;;
            *) echo "::error::unknown channel '$CHANNEL'"; exit 1 ;;
          esac

          for ch in $channels; do
            if [ "$ch" = stable ]; then up=main; else up=dev; fi

            if ! git rev-parse --verify --quiet "refs/remotes/origin/$ch" >/dev/null; then
              echo "::notice::$ch does not exist yet, nothing to sync"
              echo "exists_$ch=false" >> "$GITHUB_OUTPUT"
              continue
            fi
            echo "exists_$ch=true" >> "$GITHUB_OUTPUT"

            git checkout --quiet -B "$ch" "refs/remotes/origin/$ch"

            upstream_tip=$(git rev-parse "upstream/$up")
            base=$(git merge-base "refs/heads/$ch" "upstream/$up")
            echo "$ch: upstream/$up tip=$upstream_tip, our base=$base"

            if [ "$upstream_tip" = "$base" ]; then
              echo "$ch: upstream has not moved"
              continue
            fi

            # Our commits are exactly what sits after the old merge base, so
            # replaying that range on the new upstream tip carries our patches
            # over and leaves the branch a straight line on top of upstream.
            if git rebase --onto "upstream/$up" "$base" "$ch"; then
              git push --quiet --force-with-lease origin "$ch"
              echo "synced_$ch=true" >> "$GITHUB_OUTPUT"
              echo "$ch: rebased onto $upstream_tip and pushed"
            else
              git rebase --abort
              echo "conflict_$ch=true" >> "$GITHUB_OUTPUT"
              echo "::error::$ch: our commits no longer apply to upstream/$up ($upstream_tip)"
            fi
          done

          # Every release carries a build stamp of its own: upstream's version
          # plus <date><sequence>. It is never committed -- build and release
          # both receive it as an input, so an upstream version bump can never
          # conflict with ours. The stamp becomes the versionCode, which is what
          # lets one build install over another.
          #
          # The sequence is one past the highest spent *that day*: not the number
          # of tags, because counting assumes the stamps are contiguous and any
          # tag that ever went missing would hand the same number out twice; and
          # not per version, because that restarts at 01 the moment upstream
          # ships a new version, and on a day that already had a release it would
          # produce a lower versionCode than the one already on the phone, which
          # Android refuses to install over.
          #
          # Both channels draw from the one counter. stable is tagged with the
          # bare version while beta keeps the stamp, so the releases carry the
          # stamps that the tags alone would miss.
          today=$(date -u +%Y%m%d)
          releases=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[] | .name, .tag_name] | .[]' 2>/dev/null || true)
          tags=$(gh api "repos/${GITHUB_REPOSITORY}/tags?per_page=100" \
            --jq '.[] | .name' 2>/dev/null || true)
          highest=$(printf '%s\n%s\n' "$releases" "$tags" \
            | sed -n "s/.*${today}\([0-9][0-9]*\).*/\1/p" | sort -n | tail -1)
          # 10#: past the eighth build of a day the stamp carries a leading zero,
          # and bash would read a bare 09 as an invalid octal number.
          stamp=$(( 10#${highest:-0} + 1 ))
          for ch in $channels; do
            git rev-parse --verify --quiet "refs/heads/$ch" >/dev/null || continue
            base_version=$(git show "$ch:pubspec.yaml" | sed -n 's/^version: *\([^+]*\).*/\1/p' | tr -d '\r')
            seq=$(printf '%02d' "$stamp")
            stamp=$(( stamp + 1 ))
            echo "version_$ch=${base_version}+${today}${seq}" >> "$GITHUB_OUTPUT"
            echo "$ch: next version ${base_version}+${today}${seq}"
          done

      - name: Tell Telegram when a sync could not be applied
        if: >-
          always() &&
          (steps.rebase.outputs.conflict_stable == 'true' ||
           steps.rebase.outputs.conflict_beta == 'true')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONFLICT_STABLE: ${{ steps.rebase.outputs.conflict_stable }}
          CONFLICT_BETA: ${{ steps.rebase.outputs.conflict_beta }}
        run: |
          set -euo pipefail
          [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ] || exit 0
          which=""
          [ "$CONFLICT_STABLE" = true ] && which="stable（← 上游 main）"
          [ "$CONFLICT_BETA" = true ] && which="${which:+$which / }beta（← 上游 dev）"
          {
            echo "⚠️ FlClash 同步中止：上游更新与我们的改动冲突"
            echo
            echo "冲突分支：${which}"
            echo "没有构建、没有发布，等人工处理。"
            echo "构建日志：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/msg.txt
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@/tmp/msg.txt" \
            || echo "::warning::Telegram 推送失败"

      - name: Fail when a rebase conflicted
        if: >-
          steps.rebase.outputs.conflict_stable == 'true' ||
          steps.rebase.outputs.conflict_beta == 'true'
        run: |
          echo "::error::resolve the conflict by hand, then re-run the sync"
          exit 1

      - name: Plan
        id: plan
        env:
          CHANNEL: ${{ inputs.channel || 'all' }}
          FORCE: ${{ inputs.force_build || 'false' }}
          SYNCED_STABLE: ${{ steps.rebase.outputs.synced_stable }}
          SYNCED_BETA: ${{ steps.rebase.outputs.synced_beta }}
          CONFLICT_STABLE: ${{ steps.rebase.outputs.conflict_stable }}
          CONFLICT_BETA: ${{ steps.rebase.outputs.conflict_beta }}
          EXISTS_STABLE: ${{ steps.rebase.outputs.exists_stable }}
          EXISTS_BETA: ${{ steps.rebase.outputs.exists_beta }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            all) want_stable=true; want_beta=true ;;
            stable) want_stable=true; want_beta=false ;;
            beta) want_stable=false; want_beta=true ;;
            *) echo "::error::unknown channel '$CHANNEL'"; exit 1 ;;
          esac

          # A channel only gets built if it exists: `force_build` means "build
          # even without new upstream commits", not "build the ones we have not
          # created yet".
          decided() { # $1 = wanted, $2 = synced, $3 = conflicted, $4 = exists
            [ "$1" = true ] && [ "$3" != true ] && [ "$4" = true ] &&
              { [ "$2" = true ] || [ "$FORCE" = true ]; } && echo true || echo false
          }

          echo "build_stable=$(decided "$want_stable" "$SYNCED_STABLE" "$CONFLICT_STABLE" "$EXISTS_STABLE")" >> "$GITHUB_OUTPUT"
          echo "build_beta=$(decided "$want_beta" "$SYNCED_BETA" "$CONFLICT_BETA" "$EXISTS_BETA")" >> "$GITHUB_OUTPUT"
          echo "plan: stable=$want_stable exists=$EXISTS_STABLE synced=$SYNCED_STABLE conflict=$CONFLICT_STABLE"
          echo "plan: beta=$want_beta exists=$EXISTS_BETA synced=$SYNCED_BETA conflict=$CONFLICT_BETA force=$FORCE"

  test-stable:
    name: Test stable
    needs: sync
    if: needs.sync.outputs.build_stable == 'true'
    uses: ./.github/workflows/build-channel.yaml
    with:
      channel: stable
      branch: stable
      env: stable
      version: ${{ needs.sync.outputs.version_stable }}
      stage: test
    secrets: inherit

  build-stable:
    name: Build stable
    needs: [sync, test-stable]
    if: needs.sync.outputs.build_stable == 'true'
    uses: ./.github/workflows/build-channel.yaml
    with:
      channel: stable
      branch: stable
      env: stable
      version: ${{ needs.sync.outputs.version_stable }}
      stage: build
    secrets: inherit

  test-beta:
    name: Test beta
    needs: sync
    if: needs.sync.outputs.build_beta == 'true'
    uses: ./.github/workflows/build-channel.yaml
    with:
      channel: beta
      branch: beta
      env: pre
      version: ${{ needs.sync.outputs.version_beta }}
      stage: test
    secrets: inherit

  build-beta:
    name: Build beta
    needs: [sync, test-beta]
    if: needs.sync.outputs.build_beta == 'true'
    uses: ./.github/workflows/build-channel.yaml
    with:
      channel: beta
      branch: beta
      env: pre
      version: ${{ needs.sync.outputs.version_beta }}
      stage: build
    secrets: inherit

  # A release needs its own channel's tests to have passed. A single failed
  # platform only costs that platform: fail-fast is off in the build matrix and
  # publishing whatever arrived is the point, so only `cancelled` blocks it.
  release-stable:
    name: Release stable
    needs: [sync, test-stable, build-stable]
    if: >-
      inputs.publish &&
      needs.sync.outputs.build_stable == 'true' &&
      needs.test-stable.result == 'success' &&
      needs.build-stable.result != 'cancelled'
    uses: ./.github/workflows/publish-release.yaml
    with:
      channel: stable
      branch: stable
      version: ${{ needs.sync.outputs.version_stable }}
      prerelease: false
    secrets: inherit

  release-beta:
    name: Release beta
    needs: [sync, test-beta, build-beta]
    if: >-
      inputs.publish &&
      needs.sync.outputs.build_beta == 'true' &&
      needs.test-beta.result == 'success' &&
      needs.build-beta.result != 'cancelled'
    uses: ./.github/workflows/publish-release.yaml
    with:
      channel: beta
      branch: beta
      version: ${{ needs.sync.outputs.version_beta }}
      prerelease: true
    secrets: inherit
