name: sync upstream and release

# `beta` is the channel that follows upstream: upstream's `dev` plus our own
# commits rebased on top. `main` is the stable channel and is *never* synced
# from upstream -- it only moves when a beta is promoted into it (the `promote`
# input), so the stable channel ships code that already ran as beta. The `ci`
# branch holds *only* the automation, and a copy of it lives on `main` because
# GitHub runs scheduled workflows from the default branch alone; a promotion
# refreshes that copy from `ci`.
#
# Rebasing is what keeps our patches alive across every upstream sync, and
# upstream rewrites `dev` (force-pushes) often enough that a merge is not an
# option. A sync that cannot be applied cleanly stops loudly and tells Telegram
# instead of quietly shipping upstream alone.
#
# Flow: rebase beta<-upstream/dev -> [promote beta into main] -> build the
# channels that moved -> sign with our own keystore -> tag + GitHub Release ->
# announce on Telegram.

on:
  # Hourly. The sync job compares branch tips first, so a run with nothing new
  # to bring in stops there and publishes nothing -- "upstream moved" is the
  # trigger, not the clock.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Which channel to sync and build
        type: choice
        options:
          - all
          - stable
          - beta
        default: all
      promote:
        description: Promote beta into main (the stable channel) and build it -- needs channel=all or stable
        type: boolean
        default: false
      force_build:
        description: Build even when upstream has not moved
        type: boolean
        default: false
      publish:
        description: Create the release and announce it on Telegram
        type: boolean
        default: true

concurrency:
  group: sync-and-release
  cancel-in-progress: false

# The sync force-pushes our branches and the release creates tags, so the token
# needs write access to contents.
permissions:
  contents: write

env:
  UPSTREAM_REPO: chen08209/FlClash

jobs:
  sync:
    name: Sync upstream
    runs-on: ubuntu-latest
    outputs:
      build_stable: ${{ steps.plan.outputs.build_stable }}
      build_beta: ${{ steps.plan.outputs.build_beta }}
      version_stable: ${{ steps.rebase.outputs.version_stable }}
      version_beta: ${{ steps.rebase.outputs.version_beta }}
      build_number_stable: ${{ steps.rebase.outputs.build_number_stable }}
      build_number_beta: ${{ steps.rebase.outputs.build_number_beta }}
    steps:
      - name: Sync upstream into our branches
        id: rebase
        env:
          # GITHUB_TOKEN is refused when a push touches .github/workflows, which
          # an upstream sync regularly does, so the push needs a PAT carrying the
          # `workflow` scope.
          TOKEN: ${{ secrets.MIRROR_TOKEN || github.token }}
          CHANNEL: ${{ inputs.channel || 'all' }}
          PROMOTE: ${{ inputs.promote || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          auth="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --quiet --filter=blob:none "$auth" work
          cd work
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          # Only the branch we follow: a bare fetch pulls every feature branch
          # upstream happens to have open.
          git fetch --quiet --filter=blob:none upstream dev
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          case "$CHANNEL" in
            all) channels="stable beta" ;;
            stable) channels="stable" ;;
            beta) channels="beta" ;;
            *) echo "::error::unknown channel '$CHANNEL' (expected all, stable or beta; the stable channel builds branch main)"; exit 1 ;;
          esac

          # A channel is not a branch: the stable channel (what the repository
          # shows by default) is our `main`, the beta channel is `beta`. The
          # step outputs and the jobs that read them stay keyed by channel, so
          # only the git work below uses $br.
          branch_of() { [ "$1" = stable ] && echo main || echo "$1"; }

          # main is never synced from upstream -- only promoted into -- so unlike
          # beta it has no "nothing to sync yet" case.
          if git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "exists_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main does not exist yet, nothing to promote into"
            echo "exists_stable=false" >> "$GITHUB_OUTPUT"
          fi

          # beta follows upstream's preview branch.
          if ! git rev-parse --verify --quiet refs/remotes/origin/beta >/dev/null; then
            echo "::notice::beta does not exist yet, nothing to sync"
            echo "exists_beta=false" >> "$GITHUB_OUTPUT"
          else
            echo "exists_beta=true" >> "$GITHUB_OUTPUT"
            git checkout --quiet -B beta refs/remotes/origin/beta

            upstream_tip=$(git rev-parse upstream/dev)
            base=$(git merge-base refs/heads/beta upstream/dev)
            echo "beta: upstream/dev tip=$upstream_tip, our base=$base"

            if [ "$upstream_tip" = "$base" ]; then
              echo "beta: upstream has not moved"
            else
              # Our commits are exactly what sits after the old merge base, so
              # replaying that range on the new upstream tip carries our patches
              # over and leaves the branch a straight line on top of upstream.
              if git rebase --onto upstream/dev "$base" beta; then
                git push --quiet --force-with-lease origin beta
                echo "synced_beta=true" >> "$GITHUB_OUTPUT"
                echo "beta: rebased onto $upstream_tip and pushed"
              else
                git rebase --abort
                echo "conflict_beta=true" >> "$GITHUB_OUTPUT"
                echo "::error::beta: our commits no longer apply to upstream/dev ($upstream_tip)"
              fi
            fi
          fi

          # Promotion: the stable channel ships what beta has already run, so it
          # takes beta's tree wholesale.
          #
          # A merge -- even with `-X theirs` -- is not an option: upstream's main
          # and dev have diverged (each carries commits the other never got,
          # upstream cherry-picks between them), so their common ancestor is far
          # behind and merging would union both lines. The stable channel would
          # then ship code beta never ran. Instead the index is reset onto beta's
          # tree, the working tree follows it, and anything beta does not have is
          # dropped. The workflow copies, which live on main and ci alone, are
          # then taken from ci, their source of truth.
          if [ "$PROMOTE" = true ]; then
            case " $channels " in
              *" stable "*) ;;
              *) echo "::notice::promote needs the stable channel; use channel=all or channel=stable"; PROMOTE=false ;;
            esac
          fi
          if [ "$PROMOTE" = true ]; then
            main_before=$(git rev-parse refs/remotes/origin/main)
            beta_tip=$(git rev-parse refs/heads/beta)
            git checkout --quiet -B main "$main_before"
            git read-tree -u --reset beta
            git clean --quiet -fd
            git checkout --quiet refs/remotes/origin/ci -- \
              .github/workflows/ci.yaml \
              .github/workflows/build-channel.yaml \
              .github/workflows/publish-release.yaml
            git add -A
            if git diff --quiet --cached HEAD; then
              echo "main already carries beta; nothing to promote"
            else
              git commit --quiet -m "promote: beta $(git rev-parse --short "$beta_tip") into main"
              # The stable channel has to build exactly what beta ran, so the
              # workflow copies are the only thing allowed to differ -- checked
              # rather than trusted.
              unexpected=$(git diff --name-only beta \
                | grep -vE '^\.github/workflows/[A-Za-z0-9_.-]+$' || true)
              if [ -n "$unexpected" ]; then
                echo "::error::main does not match beta after promotion:"
                printf '%s\n' "$unexpected"
                exit 1
              fi
              git push --quiet origin main
              echo "synced_stable=true" >> "$GITHUB_OUTPUT"
              echo "stable: promoted beta $(git rev-parse --short "$beta_tip") into main"
            fi
          fi

          # Two numbers per release.
          #
          # The one users see is upstream's three components plus a fourth of our
          # own, counting the releases of the line it belongs to: a new version
          # line starts at .0, and a promoted beta takes a fresh number so that
          # beta users are offered the stable build as well. Only Android can
          # display it (see the build workflow), and the release tag is exactly
          # it -- so the app's own update check, which compares the latest tag
          # against its own versionName, compares like with like.
          #
          # The versionCode -- what Android uses to decide whether one build may
          # install over another -- comes from a build number of <date><sequence
          # that day>, the shape upstream itself uses. The sequence is one past
          # the highest spent *that day*: not the number of tags, because
          # counting assumes the stamps are contiguous and any tag that ever went
          # missing would hand the same number out twice; and not per version,
          # because that restarts at 01 the moment upstream ships a new version,
          # and on a day that already had a release it would produce a lower
          # versionCode than the one already on the phone, which Android refuses
          # to install over. Both channels draw from the one counter, stable
          # first: the same day gives stable ...05 and beta ...06.
          #
          # The tags carry only the version, so the build number is read back
          # from the release titles and notes, which is where it is written;
          # releases come back newest first, so the ones spent today are on the
          # first page. The revision is counted from the tags in the clone
          # instead of the tags API, which pages at 100 names and upstream alone
          # already has more tags than that.
          today=$(date -u +%Y%m%d)
          titles=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[] | .name, .body] | .[]' 2>/dev/null || true)
          highest_stamp=$(printf '%s\n' "$titles" \
            | sed -n "s/.*${today}\([0-9][0-9]*\).*/\1/p" | sort -n | tail -1)
          # 10#: past the eighth build of a day the stamp carries a leading zero,
          # and bash would read a bare 09 as an invalid octal number.
          stamp=$(( 10#${highest_stamp:-0} + 1 ))
          taken=""
          for ch in $channels; do
            br=$(branch_of "$ch")
            git rev-parse --verify --quiet "refs/heads/$br" >/dev/null || continue
            base_version=$(git show "$br:pubspec.yaml" | sed -n 's/^version: *\([^+]*\).*/\1/p' | tr -d '\r')
            # The fourth component counts the releases of this line, so a new
            # line starts at .0 instead of inheriting the last line's count.
            # Past the highest tag of the line, so a tag that went missing never
            # hands the same number out twice.
            highest_revision=$(git tag --list "v${base_version}.*" \
              | sed -n "s/^v${base_version//./\\.}\.\([0-9][0-9]*\)$/\1/p" \
              | sort -n | tail -1)
            if [[ -n "$highest_revision" ]]; then
              revision=$(( 10#${highest_revision} + 1 ))
            else
              revision=0
            fi
            while [[ " $taken " == *" ${base_version}.${revision} "* ]]; do
              revision=$(( revision + 1 ))
            done
            taken="$taken ${base_version}.${revision}"
            seq=$(printf '%02d' "$stamp")
            echo "version_$ch=${base_version}.${revision}" >> "$GITHUB_OUTPUT"
            echo "build_number_$ch=${today}${seq}" >> "$GITHUB_OUTPUT"
            echo "$ch ($br): next version ${base_version}.${revision}, build number ${today}${seq}"
            stamp=$(( stamp + 1 ))
          done

      - name: Tell Telegram when a sync could not be applied
        if: always() && steps.rebase.outputs.conflict_beta == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ] || exit 0
          {
            echo "⚠️ FlClash 同步中止：上游更新与我们的改动冲突"
            echo
            echo "冲突分支：beta（← 上游 dev）"
            echo "没有构建、没有发布，等人工处理。"
            echo "构建日志：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/msg.txt
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@/tmp/msg.txt" \
            || echo "::warning::Telegram 推送失败"

      - name: Fail when a rebase conflicted
        if: steps.rebase.outputs.conflict_beta == 'true'
        run: |
          echo "::error::resolve the conflict by hand, then re-run the sync"
          exit 1

      - name: Plan
        id: plan
        env:
          CHANNEL: ${{ inputs.channel || 'all' }}
          FORCE: ${{ inputs.force_build || 'false' }}
          SYNCED_STABLE: ${{ steps.rebase.outputs.synced_stable }}
          SYNCED_BETA: ${{ steps.rebase.outputs.synced_beta }}
          CONFLICT_BETA: ${{ steps.rebase.outputs.conflict_beta }}
          EXISTS_STABLE: ${{ steps.rebase.outputs.exists_stable }}
          EXISTS_BETA: ${{ steps.rebase.outputs.exists_beta }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            all) want_stable=true; want_beta=true ;;
            stable) want_stable=true; want_beta=false ;;
            beta) want_stable=false; want_beta=true ;;
            *) echo "::error::unknown channel '$CHANNEL' (expected all, stable or beta; the stable channel builds branch main)"; exit 1 ;;
          esac

          # A channel only gets built if it exists: `force_build` means "build
          # even without new upstream commits", not "build the ones we have not
          # created yet". The stable channel's "new upstream commits" are a
          # promotion.
          decided() { # $1 = wanted, $2 = synced, $3 = exists
            [ "$1" = true ] && [ "$3" = true ] &&
              { [ "$2" = true ] || [ "$FORCE" = true ]; } && echo true || echo false
          }

          echo "build_stable=$(decided "$want_stable" "$SYNCED_STABLE" "$EXISTS_STABLE")" >> "$GITHUB_OUTPUT"
          echo "build_beta=$(decided "$want_beta" "$SYNCED_BETA" "$EXISTS_BETA")" >> "$GITHUB_OUTPUT"
          echo "plan: stable=$want_stable exists=$EXISTS_STABLE synced=$SYNCED_STABLE"
          echo "plan: beta=$want_beta exists=$EXISTS_BETA synced=$SYNCED_BETA conflict=$CONFLICT_BETA force=$FORCE"

  test-stable:
    name: Test stable
    needs: sync
    if: needs.sync.outputs.build_stable == 'true'
    uses: ./.github/workflows/build-channel.yaml
    with:
      channel: stable
      branch: main
      env: stable
      version: ${{ needs.sync.outputs.version_stable }}
      build_number: ${{ needs.sync.outputs.build_number_stable }}
      stage: test
    secrets: inherit

  build-stable:
    name: Build stable
    needs: [sync, test-stable]
    if: needs.sync.outputs.build_stable == 'true'
    uses: ./.github/workflows/build-channel.yaml
    with:
      channel: stable
      branch: main
      env: stable
      version: ${{ needs.sync.outputs.version_stable }}
      build_number: ${{ needs.sync.outputs.build_number_stable }}
      stage: build
    secrets: inherit

  test-beta:
    name: Test beta
    needs: sync
    if: needs.sync.outputs.build_beta == 'true'
    uses: ./.github/workflows/build-channel.yaml
    with:
      channel: beta
      branch: beta
      env: pre
      version: ${{ needs.sync.outputs.version_beta }}
      build_number: ${{ needs.sync.outputs.build_number_beta }}
      stage: test
    secrets: inherit

  build-beta:
    name: Build beta
    needs: [sync, test-beta]
    if: needs.sync.outputs.build_beta == 'true'
    uses: ./.github/workflows/build-channel.yaml
    with:
      channel: beta
      branch: beta
      env: pre
      version: ${{ needs.sync.outputs.version_beta }}
      build_number: ${{ needs.sync.outputs.build_number_beta }}
      stage: build
    secrets: inherit

  # A release needs its own channel's tests to have passed. A single failed
  # platform only costs that platform: fail-fast is off in the build matrix and
  # publishing whatever arrived is the point, so only `cancelled` blocks it.
  release-stable:
    name: Release stable
    needs: [sync, test-stable, build-stable]
    if: >-
      inputs.publish &&
      needs.sync.outputs.build_stable == 'true' &&
      needs.test-stable.result == 'success' &&
      needs.build-stable.result != 'cancelled'
    uses: ./.github/workflows/publish-release.yaml
    with:
      channel: stable
      branch: main
      version: ${{ needs.sync.outputs.version_stable }}
      build_number: ${{ needs.sync.outputs.build_number_stable }}
      prerelease: false
    secrets: inherit

  release-beta:
    name: Release beta
    needs: [sync, test-beta, build-beta]
    if: >-
      inputs.publish &&
      needs.sync.outputs.build_beta == 'true' &&
      needs.test-beta.result == 'success' &&
      needs.build-beta.result != 'cancelled'
    uses: ./.github/workflows/publish-release.yaml
    with:
      channel: beta
      branch: beta
      version: ${{ needs.sync.outputs.version_beta }}
      build_number: ${{ needs.sync.outputs.build_number_beta }}
      prerelease: true
    secrets: inherit
