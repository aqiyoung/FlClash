# TEMPORARY workflow #6: run ONLY the disclaimer dialog tests against an
# arbitrary ref, with a short per-test timeout so a hanging test fails fast.
# Used to compare our patched `beta` against the untouched upstream mirror
# (`dev`) and tell a pre-existing failure from one we introduced.
name: diag6

on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch/tag/sha to test
        required: true
        default: beta
      timeout:
        description: per-test timeout
        required: false
        default: 90s

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLUTTER_VERSION: '3.47.6'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Show which revision we are testing
        run: |
          echo "ref=${{ inputs.ref }}"
          git log --oneline -3

      - name: Run the disclaimer dialog tests
        run: flutter test test/common/dialog_test.dart --reporter expanded --timeout "${{ inputs.timeout }}"
