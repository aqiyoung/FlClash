# TEMPORARY, dispatch only: diff our previous dev APK against our newest dev APK
# to see whether anything a scanner looks at changed between them.
name: verify apk

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  old-vs-new:
    runs-on: ubuntu-latest
    steps:
      - name: Download both dev APKs
        run: |
          set -euo pipefail
          curl -fsSL -o old.apk "https://github.com/aqiyoung/FlClash/releases/download/dev-0.9.1-26101617.5/FlClash-0.9.1-android-arm64-v8a.apk"
          curl -fsSL -o new.apk "https://github.com/aqiyoung/FlClash/releases/download/dev-0.9.1-26101702.9/FlClash-0.9.1-android-arm64-v8a.apk"
          ls -l old.apk new.apk
          sha256sum old.apk new.apk

      - name: Entry level diff
        run: |
          python3 - <<'PY'
          import collections, hashlib, zipfile


          def dump(path):
              out = {}
              with zipfile.ZipFile(path) as zf:
                  for info in zf.infolist():
                      data = zf.read(info)
                      out[info.filename] = (len(data), hashlib.sha256(data).hexdigest())
              return out


          old, new = dump("old.apk"), dump("new.apk")
          print(f"entries: old={len(old)} new={len(new)}")
          print("ONLY in new:", sorted(set(new) - set(old)))
          print("ONLY in old:", sorted(set(old) - set(new)))
          differ = sorted(n for n in set(old) & set(new) if old[n][1] != new[n][1])
          print(f"same name, different content ({len(differ)}):")
          for name in differ:
              print(f"    {name}  old={old[name][0]}B  new={new[name][0]}B")
          print("by top level:", dict(collections.Counter(n.split('/')[0] for n in differ)))
          print("size delta of the big ones:")
          for name in differ:
              if name.endswith(('.so', '.dex', '.arsc')):
                  print(f"    {name}: {new[name][0]-old[name][0]:+d} bytes")
          PY

      - name: Permissions and components seen by a scanner
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          for apk in old new; do
            "$BT/aapt2" dump badging "$apk.apk" 2>/dev/null \
              | grep -E "^package:|^uses-permission:|^application-label:|^sdkVersion:|^targetSdkVersion:" \
              | sort > "$apk.badging.txt"
          done
          echo "--- old vs new: package/permissions/sdk ---"
          diff old.badging.txt new.badging.txt && echo "  (identical)"

      - name: Signing certificates
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          for apk in old new; do
            echo "--- $apk.apk"
            "$BT/apksigner" verify --print-certs "$apk.apk" 2>&1 \
              | grep -iE "signer #1 certificate (dn|sha-256)|verified using" || true
          done
