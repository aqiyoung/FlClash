# TEMPORARY workflow #5: build our first own patch (disclaimer: type-it-out ->
# tick-the-box) from our own `beta` branch, signed with the candidate key, and
# publish it as a prerelease test build. Nothing touches the live channels.
name: diag5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Independent verification that our test edit still matches the widget tree.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FLUTTER_VERSION: '3.47.6'
    steps:
      - name: Checkout our beta branch
        uses: actions/checkout@v4
        with:
          ref: beta
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Run the disclaimer dialog tests
        run: flutter test test/common/dialog_test.dart --reporter expanded

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FLUTTER_VERSION: '3.47.6'
      GO_VERSION: '1.27.1'
      NDK_VERSION: r28c
    steps:
      - name: Checkout our beta branch
        uses: actions/checkout@v4
        with:
          ref: beta
          submodules: recursive

      - name: Inject the candidate release key
        env:
          KEYSTORE_B64: ${{ secrets.NEW_KEYSTORE }}
          STORE_PW: ${{ secrets.NEW_STORE_PASSWORD }}
          KEY_PW: ${{ secrets.NEW_KEY_PASSWORD }}
          ALIAS: ${{ secrets.NEW_KEY_ALIAS }}
        run: |
          set -euo pipefail
          pw="${STORE_PW:-${KEY_PW:-}}"
          alias="${ALIAS:-flclash}"
          echo "$KEYSTORE_B64" | base64 -d > /tmp/keystore.p12
          keytool -importkeystore -srckeystore /tmp/keystore.p12 -srcstoretype PKCS12 \
            -srcstorepass "$pw" -destkeystore android/app/keystore.jks -deststoretype JKS \
            -deststorepass "$pw" -destkeypass "$pw" -noprompt
          {
            echo "storePassword=$pw"
            echo "keyAlias=$alias"
            echo "keyPassword=$pw"
          } >> android/local.properties

      - name: Inject our own version number
        # This is how the real pipeline will number releases: upstream's version
        # plus our own build number. Nothing is committed, so upstream's own
        # version bumps can never conflict with ours.
        run: |
          set -euo pipefail
          base="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml | tr -d '\r')"
          code="$(date -u +%Y%m%d)02"
          echo "version: ${base}+${code}" > /tmp/version.txt
          sed -i "s/^version: .*/version: ${base}+${code}/" pubspec.yaml
          grep -n '^version:' pubspec.yaml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android --env pre -v

      - name: Show what was built
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          ls -l dist/
          for apk in dist/*.apk; do
            echo "== $apk"
            "$BT/aapt2" dump badging "$apk" | head -1
            "$BT/apksigner" verify --print-certs "$apk" | sed -n '1,6p'
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete aq-beta-test --repo aqiyoung/FlClash --yes --cleanup-tag || true
          gh release create aq-beta-test dist/*.apk --repo aqiyoung/FlClash --prerelease \
            --title "测试包：首次启动不再需要照着打字（勾选即可）+ 候选新签名" \
            --notes "Our beta branch (upstream dev + our disclaimer patch), signed with the candidate release key. 仅用于验证，不是正式渠道。"
